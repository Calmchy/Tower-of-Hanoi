<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanoi · Pure Prolog Server</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="game-container">
    <div class="hanoi-panel">
      <div class="info-row">
        <div class="status" id="statusMsg">Connecting to Prolog...</div>
        <div class="stat-box">✅ <span id="moveCounter">0</span></div>
        <div class="stat-box">❌ <span id="invalidCounter">0</span></div>
        <div class="timer-box" id="timerDisplay">00:00.0</div>
      </div>

      <div class="towers-container" id="towersContainer"></div>

      <div class="controls">
        <div class="control-group">
          <label>Towers (3-8)</label>
          <input type="number" id="towerCountInput" min="3" max="8" value="3">
        </div>
        <div class="control-group">
          <label>Disks (1-8)</label>
          <input type="number" id="diskCountInput" min="1" max="8" value="3">
        </div>
        <button id="resetBtn">⟳ New Game</button>
        <button id="refreshBtn">🔄 Refresh App</button>
        <button id="moveBtn" disabled>↗️ Move To...</button>
        <button id="autoBtn">🤖 Auto Solve</button>
      </div>

      <div class="speed-row">
        <label>Auto-Solve Speed: <span id="speedValue">5x</span></label>
        <input type="range" id="speedSlider" min="1" max="10" value="5">
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="winModal">
    <div class="modal-card">
      <h1>🏆 Solved!</h1>
      <p>Time: <span id="modalTime"></span></p>
      <p>Moves: <span id="modalMoves"></span> (Optimal: <span id="modalOptimal"></span>)</p>
      <p>Invalid: <span id="modalInvalid"></span></p>
      <button id="playAgainBtn">Play Again</button>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
