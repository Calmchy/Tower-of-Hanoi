<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tower of Hanoi</title>
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>

        <div class="cGame">
            <div class="pHanoi">

                <div class="iRow"></div>
                    <div class="stat" id="sMsg">Ready
                    <div class="sBox">
                        <span class="sText">Move:</span>
                        <span class="sValue" id="mCounter">0</span>
                    </div>
                    <div class="sBox sInvalid">
                        <span class="sText">Invalid</span>
                        <span class="sValue" id="iCounter">0</span>
                    </div>
                    <div class="tBox" id="tDisplay">00:00.0</div>
                </div>

                <div class="cTower" id="tContaner"></div>

                <div class="controls">

                    <div class="cGroup">
                        <label>Tower</label>
                        <input type="number" id="tCInput" min="3" max="6" value="3" step="1">
                    </div>

                    <div class="cGroup">
                        <label>Disk</label>
                        <input type="number" id="dCInput" min="3" max="6" value="3" step="1">
                    </div>

                    <button id="bReset">New Game</button>
                    <button id="bMove">Move Disk</button>
                    <button id="bAuto">Auto Solve</button>
                    <button id="bMute">Sound</button>

                </div>
                
                <div class="aRow">
                    <label>Animation Speed:</label>
                    <input type="range" id="sSlider" min="1" max="10" value="5" step="1">
                    <span class="spValue" id="sValue">5x</span>
                </div>

            </div>
        </div>

        <div class="mOverlay" id="wModal" aria-hidden="true">
            <div class="mCard">

                <div class="mTropy">🏆</div>
                <h2 id="wTitle">You Solved It!</h2>
                <p class="mSubtitle">The tower has been rebuilt. Well done!</p>

                <div class="mStats">

                    <div class="mStat">
                        <span class="mSIcon">💿</span>
                        <span class="mSLabel">Disks</span>
                        <span class="mSValue" id="mDisk">3</span>
                    </div>

                    <div class="mStat">
                        <span class="mSIcon">🏛️</span>
                        <span class="mSLabel">Towers</span>
                        <span class="mSValue" id="mTowers">3</span>
                    </div>

                    <div class="mStat">
                        <span class="mSIcon">✅</span>
                        <span class="mSLabel">Moves</span>
                        <span class="mSValue" id="mMoves">0</span>
                    </div>

                    <div class="mStat">
                        <span class="mSIcon">❌</span>
                        <span class="mSLabel">Invalid</span>
                        <span class="mSValue" id="mIvalid">0</span>
                    </div>

                    <div class="mStat mSWide">
                        <span class="mSIcon">⏱️</span>
                        <span class="mSLabel">Time</span>
                        <span class="mSValue" id="mTime">00:00.0</span>
                    </div>

                    <div class="mStat mSWide mSGold">
                        <span class="mSIcon">⭐</span>
                        <span class="mSLabel">Perfect score is</span>
                        <span class="mSValue" id="mOptimal">7</span>
                    </div>

                </div>

                <p class="mMessage" id="mMessage"></p>

                <div class="mActions">
                    <button class="mBtn mBPrimary" id="mPlayA">Play Again</button>
                    <button class="mBtn mBSecondary" id="mClose">Close</button>
                </div>

            </div>
        </div>

    </body>

</html>
